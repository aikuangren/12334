server {
    listen 8080;
    server_name _;
    absolute_redirect off;
    port_in_redirect off;

    root /usr/share/nginx/html;
    index h5-c.html index.html;

    client_max_body_size 20M;

    location = / {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files /h5-c.html =404;
    }

    location / {
        try_files $uri $uri/ /h5-c.html;
    }

    location /api/ {
        default_type text/plain;
        return 404 'api disabled';
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|ico|svg|webp|woff|woff2|ttf|eot|mp3|mp4)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:html|json)$ {
        expires off;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    location /nginx-health {
        default_type text/plain;
        return 200 'ok';
    }
}
