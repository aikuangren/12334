spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/card_draw?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USERNAME:card_draw}
    password: ${MYSQL_PASSWORD:}
    hikari:
      maximum-pool-size: ${MYSQL_POOL_MAX_SIZE:20}
      minimum-idle: ${MYSQL_POOL_MIN_IDLE:5}
      connection-timeout: ${MYSQL_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${MYSQL_MAX_LIFETIME_MS:1800000}
  h2:
    console:
      enabled: false
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
