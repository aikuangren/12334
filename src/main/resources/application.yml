server:
  port: ${PORT:8080}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: card-draw-backend
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  flyway:
    enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

card-draw:
  daily-free-quota: 5
  max-course-reset-per-day: 10
  max-practice-extra-per-day: 20
  business-reset-hour: 5
  cdn-base-url: https://cdn.51talkjr.com/
  upload-dir: uploads
  static-pool-config-location: ${CARD_POOL_CONFIG_LOCATION:classpath*:card-pool/*.json}
